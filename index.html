<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사고 깊이 자가진단</title>
<style>
  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --card: #1a1a35;
    --border: rgba(255,255,255,0.08);
    --accent1: #7c3aed;
    --accent2: #2563eb;
    --accent3: #06b6d4;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --gold: #f59e0b;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background orbs */
  .bg-orbs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: float 8s ease-in-out infinite;
  }
  .orb1 { width: 500px; height: 500px; background: var(--accent1); top: -200px; left: -150px; animation-delay: 0s; }
  .orb2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; animation-delay: -3s; }
  .orb3 { width: 300px; height: 300px; background: var(--accent3); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  .container {
    position: relative; z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  /* ── INTRO ── */
  #intro {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; text-align: center;
    gap: 28px;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(124,58,237,0.2);
    border: 1px solid rgba(124,58,237,0.4);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px; color: #a78bfa;
    letter-spacing: 0.05em;
  }

  .intro-title {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 800;
    line-height: 1.2;
    background: linear-gradient(135deg, #a78bfa, #60a5fa, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .intro-sub {
    font-size: 1rem; color: var(--muted);
    max-width: 480px; line-height: 1.7;
  }

  .score-legend {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: 100%; max-width: 540px;
  }
  .score-legend .item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
    flex: 1 1 200px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }

  .btn-start {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 16px 48px;
    font-size: 1.1rem; font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 40px rgba(124,58,237,0.4);
  }
  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 60px rgba(124,58,237,0.6);
  }

  /* ── QUIZ ── */
  #quiz { display: none; }

  /* Progress */
  .progress-wrap {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,26,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    margin-bottom: 32px;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-bar-bg {
    height: 6px; background: rgba(255,255,255,0.08);
    border-radius: 999px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent1), var(--accent3));
    border-radius: 999px;
    transition: width 0.5s ease;
  }

  /* Category header */
  .cat-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; margin-top: 40px;
  }
  .cat-header:first-of-type { margin-top: 0; }
  .cat-icon {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    font-size: 20px;
    flex-shrink: 0;
  }
  .cat-title {
    font-size: 1.15rem; font-weight: 700;
  }
  .cat-num {
    font-size: 12px; color: var(--muted);
    margin-top: 2px;
  }

  /* Question card */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .q-card:hover { border-color: rgba(124,58,237,0.3); }
  .q-card.answered { border-color: rgba(124,58,237,0.25); box-shadow: 0 0 20px rgba(124,58,237,0.08); }

  .q-text {
    font-size: 0.97rem; line-height: 1.6;
    margin-bottom: 16px;
    color: #cbd5e1;
  }

  .score-buttons {
    display: flex; gap: 8px;
  }
  .score-btn {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
    padding: 10px 4px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    transition: all 0.15s;
    line-height: 1.3;
  }
  .score-btn:hover {
    background: rgba(124,58,237,0.2);
    border-color: rgba(124,58,237,0.5);
    color: #a78bfa;
  }
  .score-btn.active {
    background: linear-gradient(135deg, rgba(124,58,237,0.4), rgba(37,99,235,0.4));
    border-color: rgba(124,58,237,0.7);
    color: #fff;
    box-shadow: 0 0 16px rgba(124,58,237,0.3);
  }
  .score-btn .score-num { font-size: 17px; display: block; }
  .score-btn .score-label { font-size: 10px; opacity: 0.8; display: block; margin-top: 2px; }

  /* Floating action */
  .fab-wrap {
    position: fixed; bottom: 28px; left: 0; right: 0;
    display: flex; justify-content: center;
    z-index: 20;
  }
  .btn-result {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 16px 48px;
    font-size: 1rem; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 40px rgba(124,58,237,0.5);
    display: flex; align-items: center; gap: 10px;
    opacity: 0.4; pointer-events: none;
  }
  .btn-result.ready {
    opacity: 1; pointer-events: all;
  }
  .btn-result.ready:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 50px rgba(124,58,237,0.7);
  }
  .answered-count {
    background: rgba(255,255,255,0.2);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 13px;
  }

  /* ── RESULT ── */
  #result { display: none; }

  .result-hero {
    text-align: center;
    padding: 48px 24px 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .result-hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center top, rgba(124,58,237,0.15), transparent 70%);
  }

  .total-label { font-size: 14px; color: var(--muted); letter-spacing: 0.08em; }
  .total-score {
    font-size: clamp(4rem, 12vw, 6rem);
    font-weight: 900;
    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin: 8px 0;
  }
  .total-max { font-size: 18px; color: var(--muted); }

  /* Score ring */
  .ring-wrap {
    display: flex; justify-content: center;
    margin: 24px 0;
  }
  .score-ring {
    position: relative;
    width: 140px; height: 140px;
  }
  .score-ring svg {
    transform: rotate(-90deg);
    width: 100%; height: 100%;
  }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 10; }
  .ring-fill {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    stroke: url(#ringGrad);
    stroke-dasharray: 345;
    stroke-dashoffset: 345;
    transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring-pct { font-size: 28px; font-weight: 800; color: #a78bfa; }
  .ring-pct-label { font-size: 11px; color: var(--muted); }

  .level-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(37,99,235,0.25));
    border: 1px solid rgba(124,58,237,0.4);
    border-radius: 999px;
    padding: 8px 24px;
    font-size: 1rem; font-weight: 700;
    color: #c4b5fd;
    margin: 12px 0 4px;
  }
  .level-desc {
    color: var(--muted); font-size: 14px; line-height: 1.7;
    max-width: 480px; margin: 0 auto;
  }
  .level-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 16px;
  }
  .level-tag {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 12px; color: var(--muted);
  }

  /* Category bars */
  .cat-scores {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 28px;
  }
  .cat-scores h3 {
    font-size: 1rem; font-weight: 700; margin-bottom: 20px;
    color: var(--text);
  }
  .cat-bar-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .cat-bar-icon { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }
  .cat-bar-name { font-size: 13px; color: var(--muted); width: 110px; flex-shrink: 0; }
  .cat-bar-bg {
    flex: 1; height: 8px; background: rgba(255,255,255,0.06);
    border-radius: 999px; overflow: hidden;
  }
  .cat-bar-fill {
    height: 100%; border-radius: 999px;
    transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .cat-bar-val { font-size: 13px; font-weight: 700; width: 36px; text-align: right; flex-shrink: 0; }

  /* Insight cards */
  .insights {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; margin-bottom: 28px;
  }
  @media (max-width: 500px) { .insights { grid-template-columns: 1fr; } }
  .insight-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .insight-card h4 { font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.06em; }
  .insight-card p { font-size: 15px; font-weight: 600; }
  .insight-card .val { font-size: 1.4rem; font-weight: 800; }
  .strength { color: #34d399; }
  .weakness { color: #f87171; }

  /* Retry */
  .btn-retry {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 16px;
    font-size: 0.95rem; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-retry:hover { background: rgba(255,255,255,0.12); }

  /* Animations */
  .fade-in { animation: fadeIn 0.6s ease both; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }

  .q-card { animation: fadeIn 0.4s ease both; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; }
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<!-- ─── INTRO ─── -->
<div id="intro">
  <div class="container" style="padding-top:0;padding-bottom:0;">
    <div class="badge">🧠 자가진단 테스트 · 40문항</div>
    <h1 class="intro-title">사고 깊이<br>자가진단</h1>
    <p class="intro-sub">당신의 사고 방식이 얼마나 깊고 입체적인지 10가지 영역에서 측정합니다.<br>각 문항에 솔직하게 응답해 주세요.</p>

    <div class="score-legend">
      <div class="item"><span class="dot" style="background:#475569"></span> 0점 · 거의 못함</div>
      <div class="item"><span class="dot" style="background:#7c3aed"></span> 1점 · 가끔 함</div>
      <div class="item"><span class="dot" style="background:#2563eb"></span> 2점 · 의식하면 가능</div>
      <div class="item"><span class="dot" style="background:#0891b2"></span> 3점 · 자연스럽게 함</div>
      <div class="item"><span class="dot" style="background:#059669"></span> 4점 · 항상 자동적으로 함</div>
    </div>

    <button class="btn-start" onclick="startQuiz()">진단 시작하기 →</button>
    <p style="font-size:12px;color:var(--muted);">총 40문항 · 10~15분 소요</p>
  </div>
</div>

<!-- ─── QUIZ ─── -->
<div id="quiz">
  <div class="container">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="prog-text">0 / 40 완료</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>
    <div id="questions"></div>
  </div>
  <div class="fab-wrap">
    <button class="btn-result" id="btn-result" onclick="showResult()">
      결과 보기
      <span class="answered-count" id="answered-count">0/40</span>
    </button>
  </div>
</div>

<!-- ─── RESULT ─── -->
<div id="result">
  <div class="container">
    <div style="text-align:center;margin-bottom:32px;">
      <div class="badge">📊 진단 완료</div>
    </div>

    <div class="result-hero fade-in">
      <div class="total-label">총점</div>
      <div class="total-score" id="res-score">0</div>
      <div class="total-max">/ 160점</div>

      <div class="ring-wrap">
        <div class="score-ring">
          <svg viewBox="0 0 120 120">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#7c3aed"/>
                <stop offset="100%" style="stop-color:#22d3ee"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="60" cy="60" r="55"/>
            <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="55"/>
          </svg>
          <div class="ring-center">
            <div class="ring-pct" id="ring-pct">0%</div>
            <div class="ring-pct-label">달성률</div>
          </div>
        </div>
      </div>

      <div class="level-badge" id="res-level">-</div>
      <div class="level-tags" id="res-tags"></div>
      <p class="level-desc" id="res-desc" style="margin-top:16px;"></p>
    </div>

    <div class="cat-scores fade-in">
      <h3>📈 영역별 점수</h3>
      <div id="cat-bars"></div>
    </div>

    <div class="insights fade-in">
      <div class="insight-card">
        <h4>💪 최고 강점 영역</h4>
        <div class="val strength" id="res-best">-</div>
        <p id="res-best-score" style="color:var(--muted);font-size:13px;margin-top:4px;"></p>
      </div>
      <div class="insight-card">
        <h4>🎯 성장 가능 영역</h4>
        <div class="val weakness" id="res-worst">-</div>
        <p id="res-worst-score" style="color:var(--muted);font-size:13px;margin-top:4px;"></p>
      </div>
    </div>

    <button class="btn-retry" onclick="retryQuiz()">↺ 다시 진단하기</button>
  </div>
</div>

    color: '#7c3aed',
    questions: [
      '깊은 고민이 실제 실행으로 이어진다.',
      '생각이 문서/시트/프로토타입 등 산출물로 변환된다.',
      '추상적 통찰을 구체 계획으로 전환한다.',
      '완벽주의 때문에 멈추지 않는다.',
    ]
  },
  {
    id: 9, icon: '🌐', name: '정체성 통합',
    color: '#0891b2',
    questions: [
      '커리어·재정·가치관을 연결해 사고한다.',
      '일과 삶의 방향성을 통합적으로 본다.',
      '내가 어떤 사람이 될지 자주 고민한다.',
      '선택을 가치 기준으로 한다.',
    ]
  },
  {
    id: 10, icon: '🔄', name: '사고 유연성',
    color: '#059669',
    questions: [
      '기존 구조를 과감히 버릴 수 있다.',
      '새 정보가 들어오면 판단을 수정한다.',
      '계획이 틀어지면 방향을 재설정한다.',
      '하나의 정답에 집착하지 않는다.',
    ]
  },
];

const SCORE_LABELS = ['거의\n못함', '가끔\n함', '의식하면\n가능', '자연스럽게\n함', '항상\n자동적'];
const SCORE_COLORS = ['#475569','#7c3aed','#2563eb','#0891b2','#059669'];

const LEVELS = [
  { min:151, max:160, label:'통합형 사고', tags:['창업가 레벨','아키텍트형','추상-구조-실행 연결'], desc:'추상·구조·실행의 연결이 완성형에 가깝습니다. 완벽주의와 속도 저하 여부를 점검해 보세요.', color:'#f59e0b' },
  { min:121, max:150, label:'전략가형 사고', tags:['시스템 설계자','구조·시간·인과 확장'], desc:'구조, 시간, 인과 확장성이 높은 전략가 수준입니다. 과도한 복잡화 리스크를 주의하세요.', color:'#a78bfa' },
  { min:81,  max:120, label:'구조적 사고 가능', tags:['PM/기획 상위권','다층 분석 가능','실행 균형 핵심'], desc:'다층 분석이 가능하고 PM·기획 상위권 수준입니다. 실행과의 균형이 성장의 핵심입니다.', color:'#60a5fa' },
  { min:0,   max:80,  label:'실무 중심 사고', tags:['실행 중심','구체 문제 해결'], desc:'깊이보다는 실행 중심의 사고 유형입니다. 구조적 확장성을 키우면 큰 도약이 가능합니다.', color:'#94a3b8' },
];

// answers[catIdx][qIdx] = 0..4 or null
let answers = CATEGORIES.map(c => c.questions.map(() => null));

function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestions();
  updateProgress();
}

function renderQuestions() {
  const container = document.getElementById('questions');
  container.innerHTML = '';

  CATEGORIES.forEach((cat, ci) => {
    // Category header
    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `
      <div class="cat-icon" style="background:${cat.color}22;border:1px solid ${cat.color}44;">${cat.icon}</div>
      <div>
        <div class="cat-title">${cat.id}️⃣ ${cat.name} 능력</div>
        <div class="cat-num">${(ci*4)+1}~${(ci*4)+4}번 문항</div>
      </div>
    `;
    container.appendChild(header);

    cat.questions.forEach((q, qi) => {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = `card-${ci}-${qi}`;

      const btns = [0,1,2,3,4].map(s => `
        <button class="score-btn ${answers[ci][qi]===s?'active':''}"
          onclick="setScore(${ci},${qi},${s},this)"
          style="${answers[ci][qi]===s?`border-color:${SCORE_COLORS[s]};background:${SCORE_COLORS[s]}22;`:''}">
          <span class="score-num">${s}</span>
          <span class="score-label">${SCORE_LABELS[s].replace('\n','<br>')}</span>
        </button>
      `).join('');

      card.innerHTML = `
        <div class="q-text"><span style="opacity:0.5;font-size:12px;">Q${(ci*4)+qi+1}</span> &nbsp;${q}</div>
        <div class="score-buttons">${btns}</div>
      `;
      if(answers[ci][qi] !== null) card.classList.add('answered');
      container.appendChild(card);
    });
  });
}

function setScore(ci, qi, score, btn) {
  answers[ci][qi] = score;

  const card = document.getElementById(`card-${ci}-${qi}`);
  card.classList.add('answered');

  // Update buttons in this card
  card.querySelectorAll('.score-btn').forEach((b, i) => {
    b.classList.remove('active');
    b.style.borderColor = '';
    b.style.background = '';
    if(i === score) {
      b.classList.add('active');
      b.style.borderColor = SCORE_COLORS[score];
      b.style.background = SCORE_COLORS[score] + '22';
    }
  });

  updateProgress();
}

function updateProgress() {
  let done = 0;
  answers.forEach(cat => cat.forEach(v => { if(v!==null) done++; }));
  const pct = Math.round((done/40)*100);
  document.getElementById('prog-text').textContent = `${done} / 40 완료`;
  document.getElementById('prog-pct').textContent = `${pct}%`;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('answered-count').textContent = `${done}/40`;

  const btn = document.getElementById('btn-result');
  if(done === 40) btn.classList.add('ready');
  else btn.classList.remove('ready');
}

function getTotal() {
  return answers.flat().reduce((a,v) => a + (v||0), 0);
}

function getCatScore(ci) {
  return answers[ci].reduce((a,v) => a + (v||0), 0);
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  window.scrollTo(0,0);

  const total = getTotal();
  const pct = Math.round((total/160)*100);

  // Score counter animation
  const scoreEl = document.getElementById('res-score');
  let cur = 0;
  const step = Math.ceil(total/60);
  const timer = setInterval(() => {
    cur = Math.min(cur+step, total);
    scoreEl.textContent = cur;
    if(cur >= total) clearInterval(timer);
  }, 20);

  // Ring
  setTimeout(() => {
    const circumference = 2 * Math.PI * 55;
    const offset = circumference - (pct/100)*circumference;
    document.getElementById('ring-fill').style.strokeDashoffset = offset;
    document.getElementById('ring-fill').style.strokeDasharray = circumference;
  }, 200);
  document.getElementById('ring-pct').textContent = pct+'%';

  // Level
  const level = LEVELS.find(l => total >= l.min && total <= l.max) || LEVELS[LEVELS.length-1];
  const levelEl = document.getElementById('res-level');
  levelEl.textContent = level.label;
  levelEl.style.color = level.color;
  levelEl.style.borderColor = level.color+'66';
  levelEl.style.background = level.color+'22';

  document.getElementById('res-desc').textContent = level.desc;
  const tagsEl = document.getElementById('res-tags');
  tagsEl.innerHTML = level.tags.map(t=>`<span class="level-tag">${t}</span>`).join('');

  // Cat bars
  const barsEl = document.getElementById('cat-bars');
  barsEl.innerHTML = CATEGORIES.map((cat,ci) => {
    const s = getCatScore(ci);
    const p = (s/16)*100;
    return `
      <div class="cat-bar-row">
        <div class="cat-bar-icon">${cat.icon}</div>
        <div class="cat-bar-name">${cat.name}</div>
        <div class="cat-bar-bg">
          <div class="cat-bar-fill" id="bar-${ci}" style="width:0%;background:${cat.color};"></div>
        </div>
        <div class="cat-bar-val" style="color:${cat.color}">${s}/16</div>
      </div>
    `;
  }).join('');

  setTimeout(() => {
    CATEGORIES.forEach((_,ci) => {
      const s = getCatScore(ci);
      document.getElementById(`bar-${ci}`).style.width = ((s/16)*100)+'%';
    });
  }, 300);

  // Best / worst
  let bestCi = 0, worstCi = 0;
  CATEGORIES.forEach((_,ci) => {
    if(getCatScore(ci) > getCatScore(bestCi)) bestCi = ci;
    if(getCatScore(ci) < getCatScore(worstCi)) worstCi = ci;
  });
  document.getElementById('res-best').textContent = CATEGORIES[bestCi].icon+' '+CATEGORIES[bestCi].name;
  document.getElementById('res-best-score').textContent = getCatScore(bestCi)+'/16점';
  document.getElementById('res-worst').textContent = CATEGORIES[worstCi].icon+' '+CATEGORIES[worstCi].name;
  document.getElementById('res-worst-score').textContent = getCatScore(worstCi)+'/16점 → 성장 여지 큼';
}

function retryQuiz() {
  answers = CATEGORIES.map(c => c.questions.map(() => null));
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  window.scrollTo(0,0);
  renderQuestions();
  updateProgress();
}
</script>
</body>
</html>
